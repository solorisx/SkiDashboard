<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circular Progress (SVG + Bootstrap)</title>

  <!-- Bootstrap (optional, for layout/utility classes) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    :root{
      --ring-size: 140px;              /* overall size of the circle */
      --ring-thickness: 12px;          /* thickness of the border */
      --ring-track: #e9ecef;           /* background track color */
      --ring-fill: #28a745;            /* fill (progress) color - Bootstrap green */
      --ring-text: #212529;
    }

    .progress-ring {
      width: var(--ring-size);
      height: var(--ring-size);
      display: grid;
      place-items: center;
      position: relative;
    }

    /* A11y text in the center */
    .progress-ring__label {
      position: absolute;
      font: 600 1rem/1 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: var(--ring-text);
      user-select: none;
    }

    /* Rotate -90deg so 0% starts at 12 o’clock instead of 3 */
    .progress-ring svg {
      transform: rotate(-90deg);
      display: block;
      overflow: visible;
    }

    .progress-ring__track {
      stroke: var(--ring-track);
      fill: none;
      stroke-width: var(--ring-thickness);
    }

    .progress-ring__bar {
      stroke: var(--ring-fill);
      fill: none;
      stroke-linecap: round;             /* rounded ends look nicer */
      stroke-width: var(--ring-thickness);
      transition: stroke-dashoffset 400ms ease;
    }

    /* Optional: smooth number update */
    .progress-ring[data-animate="true"] .progress-ring__label {
      transition: opacity .2s ease;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="h3 mb-4">Circular Progress (border fills by percentage)</h1>

    <div class="d-flex flex-column flex-sm-row align-items-center gap-4">
      <!-- The ring -->
      <div
        class="progress-ring"
        id="ring"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="50"
        aria-label="Completion"
        data-animate="true"
      >
        <!--
          We’ll set r (radius) in JS so the stroke stays fully inside the viewbox
          based on the chosen --ring-thickness.
        -->
        <svg id="ringSvg" width="100%" height="100%" viewBox="0 0 100 100">
          <circle class="progress-ring__track" cx="50" cy="50" r="45"></circle>
          <circle class="progress-ring__bar"   cx="50" cy="50" r="45"></circle>
        </svg>
        <div class="progress-ring__label" id="ringLabel">50%</div>
      </div>

      <!-- Controls (example) -->
      <form class="d-flex align-items-center gap-2" onsubmit="return false;">
        <label for="pct" class="form-label m-0">Set %</label>
        <input id="pct" type="number" class="form-control" style="width:120px" min="0" max="100" step="1" value="50" />
        <button type="button" class="btn btn-success" onclick="setProgress(+pct.value)">Update</button>
      </form>
    </div>

    <p class="text-muted mt-3">
      Tip: tweak <code>--ring-fill</code>, <code>--ring-thickness</code>, or <code>--ring-size</code> in CSS to match your design.
    </p>
  </div>

  <script>
    // Helper: create an SVG-based circular progress ring
    (function initRing(){
      const ring = document.getElementById('ring');
      const svg  = document.getElementById('ringSvg');
      const bar  = svg.querySelector('.progress-ring__bar');
      const track= svg.querySelector('.progress-ring__track');

      // Compute radius so the stroke stays inside the 100x100 viewBox:
      // max radius = 50 - strokeWidth/2
      const styles = getComputedStyle(document.documentElement);
      const thicknessPx = parseFloat(styles.getPropertyValue('--ring-thickness'));
      // Our viewBox is 100 units; relate CSS px thickness to viewBox units.
      // Easiest: pick a fixed viewBox stroke width and ignore px; but we want thickness variable.
      // We'll set SVG stroke-width in "units" proportional to viewBox:
      const strokeWidth = 12; // base units in the SVG viewBox
      track.setAttribute('stroke-width', strokeWidth);
      bar.setAttribute('stroke-width', strokeWidth);

      const r = 50 - strokeWidth / 2;
      track.setAttribute('r', r);
      bar.setAttribute('r', r);

      const C = 2 * Math.PI * r;
      bar.style.strokeDasharray = `${C} ${C}`;
      bar.style.strokeDashoffset = C; // start at 0%

      // Sync the CSS thickness to the actual element size by scaling the SVG (handled by viewBox).
      // If you want the visual thickness to follow --ring-thickness exactly,
      // you can instead compute a scale factor based on element pixel size.
      // For most cases, the above is sufficient and visually consistent.

      // Expose setter globally
      window.setProgress = function(percent){
        const p = Math.max(0, Math.min(100, percent|0));
        const offset = C * (1 - p / 100);
        bar.style.strokeDashoffset = offset;
        ring.setAttribute('aria-valuenow', String(p));
        document.getElementById('ringLabel').textContent = p + '%';
      };

      // Initialize to whatever aria-valuenow says
      setProgress(+ring.getAttribute('aria-valuenow') || 0);
    })();
  </script>
</body>
</html>

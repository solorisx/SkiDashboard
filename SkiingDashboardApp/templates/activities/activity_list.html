{% block content %}
    <h1>All Activities</h1>
    <ul>
        {% for activity in activities %}
            <li>
                <a href="{% url 'activity_detail' activity.id %}">
                    {{ activity.name }} - {{ activity.timestamp }}
                </a>
                {% if activity.get_strava_url %}
                    <a href="{{ activity.get_strava_url }}" target="_blank">View on Strava</a>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
{% endblock %}

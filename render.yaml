services:
  - type: web
    name: skidasher-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: RENDER
        value: "true"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: worker
    name: skidashboard-celery
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    # Either keep dockerCommand here OR set CMD in your Dockerfile
    dockerCommand: celery -A config worker -l info
    envVars:
      - key: RENDER
        value: "true"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

  - type: worker
    name: skidashboard-beat
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config beat -l info
    envVars:
      - key: RENDER
        value: "true"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

  # Flower exposes an HTTP UI — make it a web service and bind to $PORT
  - type: web
    name: skidashboard-flower
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config flower --port=$PORT
    healthCheckPath: /
    envVars:
      - key: RENDER
        value: "true"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

  # Render's Redis-like service is "keyvalue" and requires an ipAllowList
  - type: keyvalue
    name: skidashboard-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all (tighten this later)

databases:
  - name: skidashboard-db
    plan: free

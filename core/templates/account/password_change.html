{% extends "base/base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-5 text-center" style="max-width: 560px;">
  <div class="p-4 bg-white rounded shadow-sm">
    <h1 class="text-primary fw-bold">{% trans "Change Password" %} 🔑</h1>
    <form method="post" action="{% url 'account_change_password' %}" class="text-start mt-3">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100 fw-bold">{% trans "Change Password" %}</button>
    </form>
  </div>
</div>
{% endblock %}

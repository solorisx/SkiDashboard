{% extends "base/base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-5 text-center" style="max-width: 560px;">

  <div class="p-4 bg-white rounded shadow-sm">
    <h1 class="text-success fw-bold">{% trans "Your password has been changed" %} 🎉</h1>
    <p class="lead text-muted mt-3">
      {% trans "You can now log in with your new password." %}
    </p>
    <a href="{% url 'account_login' %}" class="btn btn-primary fw-bold mt-3">
      {% trans "Go to sign in" %}
    </a>
  </div>

</div>
{% endblock %}

{% extends "base/base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-5 text-center" style="max-width: 560px;">
  <div class="p-4 bg-white rounded shadow-sm">
    <h1 class="text-primary fw-bold">{% trans "Forgot Password" %} ❓</h1>
    <p class="text-muted">{% trans "Enter your email address below and we'll send you a link to reset your password." %}</p>
    <form method="post" action="{% url 'account_reset_password' %}" class="text-start mt-3">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100 fw-bold">{% trans "Reset Password" %}</button>
    </form>
  </div>
</div>
{% endblock %}

{% extends "base/base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-5 text-center" style="max-width: 560px;">
  <div class="p-4 bg-white rounded shadow-sm">
    <h1 class="text-primary fw-bold">{% trans "Sign out" %} 👋</h1>
    <p class="text-muted">{% trans "Are you sure you want to sign out?" %}</p>
    <form method="post" action="{% url 'account_logout' %}" class="mt-3">
      {% csrf_token %}
      <button class="btn btn-danger w-100 fw-bold">{% trans "Sign out" %}</button>
    </form>
    <a href="{{ redirect_field_value|default:'/' }}" class="btn btn-link mt-2">{% trans "Cancel" %}</a>
  </div>
</div>
{% endblock %}

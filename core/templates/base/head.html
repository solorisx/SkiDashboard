<!DOCTYPE html>
{% load static %}
<html lang="en" {% if user.is_authenticated and user.userprofile.dark_mode %}class="dark"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SlopeLog{% endblock %}</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Select2 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet JS (global — must load before any DOMContentLoaded handlers that use L) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/design-tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/badges.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/cards.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/season-pass.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/action-cards.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/area-completeness.css' %}">
    <link rel="stylesheet" href="{% static 'css/layouts/sidebar.css' %}">

    {% block extra_head %}{% endblock %}
    {% block extra_css %}{% endblock %}

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--sl-bg-page);
            color: var(--sl-text-primary);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Dark mode body override */
        html.dark body {
            background-color: var(--sl-bg-page);
            color: var(--sl-text-primary);
        }

        main { flex: 1; }

        .bd-title { display: none; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--sl-bg-subtle); }
        ::-webkit-scrollbar-thumb { background: var(--sl-border-strong); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--sl-text-muted); }

        /* Cards */
        .card {
            border-color: var(--sl-border);
            background-color: var(--sl-bg-card);
            color: var(--sl-text-primary);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--sl-shadow-md) !important;
        }

        /* Bootstrap overrides for dark mode */
        html.dark .text-muted { color: var(--sl-text-muted) !important; }
        html.dark .bg-light { background-color: var(--sl-bg-subtle) !important; }
        html.dark .bg-white { background-color: var(--sl-bg-card) !important; }
        html.dark .border-top, html.dark .border-bottom, html.dark .border { border-color: var(--sl-border) !important; }
        html.dark .table { color: var(--sl-text-primary); }
        html.dark .table-hover > tbody > tr:hover > * { background-color: var(--sl-bg-subtle); }
        html.dark .modal-content { background-color: var(--sl-bg-card); color: var(--sl-text-primary); }
        html.dark .dropdown-menu { background-color: var(--sl-bg-card); border-color: var(--sl-border); }
        html.dark .dropdown-item { color: var(--sl-text-primary); }
        html.dark .dropdown-item:hover { background-color: var(--sl-bg-subtle); }
        html.dark .form-control, html.dark .form-select {
            background-color: var(--sl-bg-input);
            border-color: var(--sl-border);
            color: var(--sl-text-primary);
        }
        html.dark .form-control:focus, html.dark .form-select:focus {
            background-color: var(--sl-bg-input);
            color: var(--sl-text-primary);
            border-color: var(--sl-slope);
        }
        html.dark .alert { background-color: var(--sl-bg-subtle); border-color: var(--sl-border); }
        html.dark .input-group-text { background-color: var(--sl-bg-subtle); border-color: var(--sl-border); color: var(--sl-text-muted); }

        /* Hover effects */
        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-lift:hover { transform: translateY(-4px); box-shadow: var(--sl-shadow-lg) !important; }

        .stats-card { transition: all 0.2s ease; }
        .stats-card:hover { transform: scale(1.02); }

        .mini-map { overflow: hidden; cursor: pointer; transition: all 0.3s ease; }
        .mini-map:hover { transform: scale(1.02); box-shadow: var(--sl-shadow-md); }

        .table-row-hover:hover { background-color: var(--sl-bg-subtle); }

        .drag-handle:hover { color: var(--sl-slope) !important; }
        .sortable-ghost { opacity: 0.4; background: var(--sl-bg-subtle); }
        .lift-ride-row.sortable-chosen { background-color: var(--sl-bg-subtle); }

        /* Pagination */
        .pagination .page-link {
            border: none;
            margin: 0 2px;
            font-weight: 500;
            transition: all 0.2s ease;
            background-color: transparent;
            color: var(--sl-text-primary);
        }
        .pagination .page-link:hover:not(.active .page-link) {
            background-color: var(--sl-slope);
            color: white;
            transform: translateY(-1px);
        }
        .pagination .page-item.active .page-link {
            background-color: var(--sl-slope);
            border-color: var(--sl-slope);
        }

        /* Alerts */
        .alert { border-radius: 0.75rem; border: none; box-shadow: var(--sl-shadow-sm); }

        /* Forms */
        .form-control:focus, .form-select:focus {
            border-color: var(--sl-slope);
            box-shadow: 0 0 0 0.2rem rgba(14, 165, 233, 0.25);
        }

        /* Select2 */
        .select2-container--default .select2-selection--single {
            height: 38px;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            background-color: var(--sl-bg-input);
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 36px;
            padding-left: 12px;
            color: var(--sl-text-primary);
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow { height: 36px; }
        .select2-dropdown {
            border-radius: 0.375rem;
            box-shadow: var(--sl-shadow-lg);
            background-color: var(--sl-bg-card);
            border-color: var(--sl-border);
        }

        /* Chart containers */
        .chart-container { position: relative; }
        .chart-container canvas { max-width: 100%; }

        /* Mobile */
        @media (max-width: 768px) {
            .display-6 { font-size: 2rem; }
            .stats-card .fs-4 { font-size: 1.25rem !important; }
            .btn-group { flex-direction: column; }
            .btn-group .btn { border-radius: 0.375rem !important; margin-bottom: 0.25rem; }
        }

        @media print {
            .sidebar, .sidebar-overlay { display: none !important; }
            .main-area { margin-left: 0 !important; }
        }
    </style>
</head>

{% extends "liftrides/base.html" %}

{% block header %}for {{ selected_year|default:"All Years" }}{% endblock %}

{% block navigation %}
  <ul class="nav nav-pills gap-2">
    <li class="nav-item">
      <a
        href="{% url 'lift_ride_list_all' %}"
        class="nav-link {% if not selected_year %}active{% endif %}">
        All Years
      </a>
    </li>
    {% for year in years %}
      <li class="nav-item">
        <a
          href="{% url 'lift_ride_list_year' year=year %}"
          class="nav-link {% if selected_year == year %}active{% endif %}">
          {{ year }}
        </a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
